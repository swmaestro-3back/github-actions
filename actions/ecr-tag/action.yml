name: ecr-tag
description: >
  ECR 저장소에 이미 있는 이미지에 태그를 더 붙인다(예: 커밋 sha 이미지에 릴리스 버전).
  같은 매니페스트를 다시 등록하므로 이미지를 다시 받거나 빌드하지 않고, 다이제스트도 바뀌지 않는다.
  이미 같은 이미지를 가리키는 태그는 건너뛰고, 다른 이미지를 가리키는 태그가 있으면 실패한다.
  AWS 자격 증명은 호출 전에 설정돼 있어야 한다.

inputs:
  image_name:
    description: "ECR repository name, e.g. finngraph/api-gateway"
    required: true
  source_tag:
    description: "Tag of the existing image, e.g. a short commit sha"
    required: true
  tags:
    description: "Space separated tags to add to the image"
    required: true

outputs:
  image_digest:
    description: "Digest of the tagged image, sha256:..."
    value: ${{ steps.tag.outputs.image_digest }}

runs:
  using: composite
  steps:
    - name: 태그 추가
      id: tag
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/tag.sh"
      env:
        IMAGE_NAME: ${{ inputs.image_name }}
        SOURCE_TAG: ${{ inputs.source_tag }}
        NEW_TAGS: ${{ inputs.tags }}
